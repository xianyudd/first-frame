# 练习分支每次 push 自动评测；起点分支只允许老师手动运行。
# 默认分支保留本文件，才能在 Actions 页选择起点分支手动运行。
name: grade

on:
  push:
    branches:
      - 'my-lesson-*'
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 raylib 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: 编译并安装 raylib（动态库）
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=OFF
          cmake --build raylib/build -j"$(nproc)"
          sudo cmake --install raylib/build
          sudo ldconfig

      - name: 编译评测程序
        if: ${{ github.ref_name != 'lesson-4' && github.ref_name != 'my-lesson-4' }}
        run: |
          mkdir -p build
          g++ -std=c++17 tests/test_todos.cpp -o build/test_todos -lraylib -lm

      - name: 运行评测
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set +e
          if [[ "$REF_NAME" == 'lesson-4' || "$REF_NAME" == 'my-lesson-4' ]]; then
            make test RAYLIB_CFLAGS= RAYLIB_LIBS='-lraylib -lm' 2>&1 | tee grade_output.txt
            code=${PIPESTATUS[0]}
          else
            ./build/test_todos | tee grade_output.txt
            code=${PIPESTATUS[0]}
            if [ -f tests/check_visual_todos.py ]; then
              python3 tests/check_visual_todos.py src/main.cpp | tee -a grade_output.txt
              visual=${PIPESTATUS[0]}
              if [ "$visual" -ne 0 ]; then code=1; fi
            fi
          fi
          {
            printf '## 自动评测结果\n\n'
            if [ "$code" -eq 0 ]; then
              printf '✅ **自动检查通过**。贴图外观仍请运行 `make run` 亲眼检查。\n'
            else
              printf '❌ **还有未通过项**。看下面的 [FAIL] / [未通过] 行；贴图也请运行 `make run` 检查。\n'
            fi
            if [[ "$REF_NAME" == 'lesson-4' || "$REF_NAME" == 'my-lesson-4' ]]; then
              printf '13 个 TODO 与独立整帧回归自动检查；无窗口测试不代表画面、声音与解释质量验收。\n'
            fi
            printf '\n```\n'
            cat grade_output.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: 保存逐项结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-results
          path: grade_output.txt
          if-no-files-found: ignore
          retention-days: 1

  publish:
    if: ${{ always() && github.event_name == 'push' && (github.ref_name == 'my-lesson-1' || github.ref_name == 'my-lesson-2' || github.ref_name == 'my-lesson-3' || github.ref_name == 'my-lesson-4') }}
    needs: grade
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: 取出公开发布模块
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: 读取逐项结果
        uses: actions/download-artifact@v4
        with:
          name: todo-results
          path: results
        continue-on-error: true
      - name: 发布到当前提交
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/publish_todo_statuses.py
